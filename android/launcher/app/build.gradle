plugins {
    alias(libs.plugins.android.application)
}

// Release APKs used to be signed with the shared Android debug key, which is
// both insecure and impossible to update over a properly signed build. When a
// keystore is supplied (locally via gradle.properties or in CI via environment
// variables / -P properties) it is used for release builds; otherwise the
// release variant is left unsigned and AGP names the artifact
// `app-release-unsigned.apk` instead of silently shipping a debug-key APK.
def releaseKeystore = null
def releaseKeystorePassword = null
def releaseKeyAlias = null
def releaseKeyPassword = null

if (project.hasProperty('revcKeystore')) {
    releaseKeystore = project.property('revcKeystore')
    releaseKeystorePassword = project.findProperty('revcKeystorePassword')
    releaseKeyAlias = project.findProperty('revcKeyAlias')
    releaseKeyPassword = project.findProperty('revcKeyPassword')
} else if (System.getenv('REVC_KEYSTORE') != null) {
    releaseKeystore = System.getenv('REVC_KEYSTORE')
    releaseKeystorePassword = System.getenv('REVC_KEYSTORE_PASSWORD')
    releaseKeyAlias = System.getenv('REVC_KEY_ALIAS')
    releaseKeyPassword = System.getenv('REVC_KEY_PASSWORD')
}
def hasReleaseSigning = releaseKeystore != null && file(releaseKeystore).exists()

android {

    namespace 'com.revc.game'
    compileSdk 35

    defaultConfig {
        applicationId "com.revc.game"
        minSdk 24
        targetSdk 35
        versionCode project.hasProperty('revcVersionCode') ? project.property('revcVersionCode').toInteger() : 1
        versionName project.hasProperty('revcVersionName') ? project.property('revcVersionName').toString() : "reVC-0.0.1"

        ndkVersion '27.2.12479018'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
            // Ship stripped shared objects. The native build keeps its debug
            // symbols in the build tree; only the packaged copies are reduced.
            debugSymbolLevel 'NONE'
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }

            // CMake build flags come from CMake itself (AGP configures the
            // native build as Release/RelWithDebInfo per variant). Passing -O3
            // or -g through cppFlags used to fight those settings.
            debuggable false
            minifyEnabled true
            shrinkResources true
            jniDebuggable false
            renderscriptDebuggable false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debug

            debuggable true
            minifyEnabled false
            jniDebuggable true
            renderscriptDebuggable true
        }
    }

    packagingOptions {
        // Do not blanket-exclude META-INF: dependencies keep service/version
        // metadata there. Only signature files must go, they are invalid after
        // the APK is re-signed anyway.
        resources.excludes += [
                'META-INF/*.SF',
                'META-INF/*.DSA',
                'META-INF/*.RSA',
                'META-INF/*.EC',
                'META-INF/MANIFEST.MF',
                'META-INF/*.kotlin_module',
                'META-INF/versions/**/module-info.class',
        ]
        // Load the .so files straight from the APK (minSdk 24+ supports it).
        jniLibs.useLegacyPackaging = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig = true
    }

    lint {
        // The vendored SDL Java files use APIs deprecated in newer SDKs; they
        // are known-good and reviewed upstream, so do not fail the CI build.
        abortOnError false
        checkReleaseBuilds false
    }

    sourceSets {
        main {
            // reVC support files only; GTA Vice City game assets are supplied
            // by the player and are NEVER checked into or bundled with the APK.
            assets.srcDir file('../../../gamefiles')
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
