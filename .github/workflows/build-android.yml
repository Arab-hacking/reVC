name: reVC Android

on:
  push:
    branches: [ "miami" ]
    paths:
      - 'android/launcher/**'
      - 'src/**'
      - 'vendor/librw/**'
      - 'tools/android/**'
      - '.github/workflows/build-android.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
  pull_request:
    branches: [ "miami" ]
    paths:
      - 'android/launcher/**'
      - 'src/**'
      - 'vendor/librw/**'
      - 'tools/android/**'
      - '.github/workflows/build-android.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
  release:
    types: published

  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK (${{ matrix.variant }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]

    defaults:
      run:
        working-directory: android/launcher

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Declare build version
        id: vars
        shell: bash
        # `git describe` used to be pointed at refs/remotes/origin/${HEAD_REF},
        # which does not exist for pull requests from forks or for tags, so the
        # step failed before Gradle even started. Describe HEAD instead - it is
        # always checked out, and `--always` keeps it working without tags.
        run: |
          set -euo pipefail
          version="$(git describe --always --tags --dirty=+ 2>/dev/null || git rev-parse --short=7 HEAD)"
          echo "build_version=${version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Clean build (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew clean

      - name: Set assemble task name
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "${VARIANT}" = "debug" ]; then
            echo "ASSEMBLE_TASK=assembleDebug" >> "$GITHUB_ENV"
          else
            echo "ASSEMBLE_TASK=assembleRelease" >> "$GITHUB_ENV"
          fi

      - name: Build ${{ matrix.variant }} APK
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          VER_CODE=$((1000 + RUN_NUMBER))
          VER_NAME="reVC-0.0.1-${PR_HEAD_SHA:0:7}"
          ./gradlew "${ASSEMBLE_TASK}" \
            "-PrevcVersionCode=${VER_CODE}" \
            "-PrevcVersionName=${VER_NAME}" \
            --no-daemon --stacktrace --parallel --build-cache > gradle-build.log 2>&1
          result=$?
          # Always surface the Gradle log in the job output: without this the
          # native compile errors are invisible when the step fails.
          tail -n 400 gradle-build.log
          if (( result != 0 )); then
            # Also expose diagnostics as check annotations: API clients and PR
            # reviewers can read them even when the raw Actions log is unavailable.
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('gradle-build.log').read_text(errors='replace').splitlines()
          keywords = ('error:', 'CMake Error', 'What went wrong:', 'ninja:',
                      'FAILED', 'Caused by:', 'Could not', 'Exception', 'failed to')
          matches = [line for line in lines if any(key in line for key in keywords)]
          for line in matches[:12] + matches[-12:] + lines[-8:]:
              safe = line[:700].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + safe)
          PY
          fi
          exit "$result"

      - name: Locate APK
        id: apk
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          # An unsigned release build is named app-release-unsigned.apk.
          apk="$(find app/build/outputs/apk/${VARIANT} -maxdepth 1 -name '*.apk' -print -quit)"
          if [ -z "${apk}" ]; then
            echo "No APK produced for ${VARIANT}" >&2
            find app/build/outputs -name '*.apk' -print >&2 || true
            exit 1
          fi
          echo "apk=${apk}" >> "$GITHUB_OUTPUT"

      - name: Verify game library and assets in APK
        run: python3 ../../tools/android/check_apk.py "${{ steps.apk.outputs.apk }}"

      - name: Upload ${{ matrix.variant }} APK
        uses: actions/upload-artifact@v4
        with:
          name: revc-${{ matrix.variant }}
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
