name: reVC Android

on:
  # Any push that touches the sources builds the APK. There is deliberately no
  # `branches:` filter here: work happens on feature branches, and a filtered
  # push trigger (plus a pull_request trigger that cannot fire while the PR has
  # conflicts) is what previously left the branch without any Android build.
  push:
    paths:
      - 'android/launcher/**'
      - 'src/**'
      - 'vendor/librw/**'
      - 'tools/android/**'
      - '.github/workflows/build-android.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
  pull_request:
    branches: [ "miami" ]
    paths:
      - 'android/launcher/**'
      - 'src/**'
      - 'vendor/librw/**'
      - 'tools/android/**'
      - '.github/workflows/build-android.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
  release:
    types: published

  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK (${{ matrix.variant }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]

    defaults:
      run:
        working-directory: android/launcher

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # The release APK has to be installable. AGP only signs a release build
      # when it is given a keystore, and with none supplied it emits
      # `app-release-unsigned.apk` - a file Android refuses to install unless
      # the user runs apksigner by hand first. The keystore is therefore
      # generated per build when the repository has no secret configured, so
      # every release artifact is signed and needs no post-processing.
      #
      # A generated key is throwaway: builds signed with different keys cannot
      # update each other, so an APK from one run replaces, not upgrades, an APK
      # from another. Configure REVC_KEYSTORE_BASE64 and friends (see
      # ANDROID_BUILD.md) to pin one identity across builds and updates.
      - name: Prepare release signing key
        id: signing
        shell: bash
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.REVC_KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASS: ${{ secrets.REVC_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.REVC_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.REVC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          workdir="${RUNNER_TEMP}/signing"
          mkdir -p "${workdir}"
          keytool_opts=(-noprompt -storetype PKCS12)

          if [ -n "${SECRET_KEYSTORE_B64}" ]; then
            echo "Using the keystore supplied through repository secrets"
            printf '%s' "${SECRET_KEYSTORE_B64}" | base64 -d > "${workdir}/revc.jks"
            store_pass="${SECRET_KEYSTORE_PASS:?REVC_KEYSTORE_PASSWORD is required with REVC_KEYSTORE_BASE64}"
            alias="${SECRET_KEY_ALIAS:?REVC_KEY_ALIAS is required with REVC_KEYSTORE_BASE64}"
            key_pass="${SECRET_KEY_PASS:-$store_pass}"
          else
            echo "No keystore secret configured: generating one for this build"
            store_pass="$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)"
            alias="revc"
            key_pass="${store_pass}"
            keytool -genkeypair "${keytool_opts[@]}" \
              -keystore "${workdir}/revc.jks" \
              -alias "${alias}" \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "${store_pass}" -keypass "${key_pass}" \
              -dname "CN=reVC, OU=Android, O=reVC, L=unknown, ST=unknown, C=XX"
          fi

          # The signing fingerprint goes into the log: it is what tells two
          # builds apart when an update is refused as "not signed by the same
          # certificate", and it is the only way to compare a local build with
          # a downloaded artifact.
          fingerprint="$(keytool -list -v -keystore "${workdir}/revc.jks" \
            -alias "${alias}" -storepass "${store_pass}" 2>/dev/null \
            | sed -n 's/.*SHA256: *//p' | head -n1)"
          echo "Signed with SHA-256: ${fingerprint:-<unknown>}"

          {
            echo "keystore=${workdir}/revc.jks"
            echo "store_password=${store_pass}"
            echo "key_alias=${alias}"
            echo "key_password=${key_pass}"
            echo "fingerprint=${fingerprint}"
          } >> "${GITHUB_OUTPUT}"

      - name: Declare build version
        id: vars
        shell: bash
        # `git describe` used to be pointed at refs/remotes/origin/${HEAD_REF},
        # which does not exist for pull requests from forks or for tags, so the
        # step failed before Gradle even started. Describe HEAD instead - it is
        # always checked out, and `--always` keeps it working without tags.
        run: |
          set -euo pipefail
          version="$(git describe --always --tags --dirty=+ 2>/dev/null || git rev-parse --short=7 HEAD)"
          echo "build_version=${version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Clean build (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew clean

      - name: Set assemble task name
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "${VARIANT}" = "debug" ]; then
            echo "ASSEMBLE_TASK=assembleDebug" >> "$GITHUB_ENV"
          else
            echo "ASSEMBLE_TASK=assembleRelease" >> "$GITHUB_ENV"
          fi

      - name: Build ${{ matrix.variant }} APK
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          VER_CODE=$((1000 + RUN_NUMBER))
          VER_NAME="reVC-0.0.1-${PR_HEAD_SHA:0:7}"
          # Pass the keystore prepared above. Without it the release variant is
          # unsigned and cannot be installed; with it, the APK is signed by the
          # build itself and needs no apksigner step afterwards.
          ./gradlew "${ASSEMBLE_TASK}" \
            "-PrevcVersionCode=${VER_CODE}" \
            "-PrevcVersionName=${VER_NAME}" \
            "-PrevcKeystore=${{ steps.signing.outputs.keystore }}" \
            "-PrevcKeystorePassword=${{ steps.signing.outputs.store_password }}" \
            "-PrevcKeyAlias=${{ steps.signing.outputs.key_alias }}" \
            "-PrevcKeyPassword=${{ steps.signing.outputs.key_password }}" \
            --no-daemon --stacktrace --parallel --build-cache > gradle-build.log 2>&1
          result=$?
          # Always surface the Gradle log in the job output: without this the
          # native compile errors are invisible when the step fails.
          tail -n 400 gradle-build.log
          if (( result != 0 )); then
            # Also expose diagnostics as check annotations: API clients and PR
            # reviewers can read them even when the raw Actions log is unavailable.
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('gradle-build.log').read_text(errors='replace').splitlines()
          keywords = ('error:', 'CMake Error', 'What went wrong:', 'ninja:',
                      'FAILED', 'Caused by:', 'Could not', 'Exception', 'failed to')
          matches = [line for line in lines if any(key in line for key in keywords)]
          for line in matches[:12] + matches[-12:] + lines[-8:]:
              safe = line[:700].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + safe)
          PY
          fi
          exit "$result"

      - name: Locate APK
        id: apk
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          # A release build that lost its keystore silently becomes
          # `app-release-unsigned.apk`, so an unsigned file must never be
          # picked up and published as if it were installable.
          #
          # Prefer the exact Gradle output name, then fall back to any APK, so a
          # renamed or single-output variant still resolves.
          apk=""
          for candidate in \
            "app/build/outputs/apk/${VARIANT}/app-${VARIANT}.apk" \
            "app/build/outputs/apk/${VARIANT}/app-${VARIANT}-signed.apk"; do
            if [ -f "${candidate}" ]; then apk="${candidate}"; break; fi
          done
          if [ -z "${apk}" ]; then
            apk="$(find app/build/outputs/apk/${VARIANT} -maxdepth 1 -name '*.apk' -print -quit)"
          fi
          if [ -z "${apk}" ]; then
            echo "No APK produced for ${VARIANT}" >&2
            find app/build/outputs -name '*.apk' -print >&2 || true
            exit 1
          fi
          case "${apk}" in
            *unsigned*) echo "APK ${apk} is unsigned; refusing to publish it" >&2
                        exit 1 ;;
          esac
          # This step runs in android/launcher, but `uses:` steps (the artifact
          # upload below) are always resolved from the repository root - the
          # job-level working-directory only applies to `run:`. Emitting the
          # bare app/build/... path therefore made upload-artifact report
          # "No files were found ... app/build/outputs/apk/debug/app-debug.apk"
          # even though the build and the APK verification had succeeded.
          root_apk="android/launcher/${apk}"
          if [ ! -f "${GITHUB_WORKSPACE}/${root_apk}" ]; then
            echo "APK path ${root_apk} does not resolve from the workspace root" >&2
            exit 1
          fi
          echo "apk=${apk}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${root_apk}" >> "$GITHUB_OUTPUT"
          echo "APK: ${root_apk} ($(du -h "${apk}" | cut -f1))"

      - name: Verify game library and assets in APK
        run: python3 ../../tools/android/check_apk.py "${{ steps.apk.outputs.apk }}"

      # A built APK is not necessarily an installable one. apksigner is the
      # authority on that, and it also prints the certificate the file carries,
      # which is what has to match the previous build for an update to be
      # accepted by Android.
      - name: Verify APK signature
        shell: bash
        env:
          APK: ${{ steps.apk.outputs.apk }}
          EXPECTED_SHA: ${{ steps.signing.outputs.fingerprint }}
        run: |
          set -euo pipefail
          # apksigner lives in the SDK's build-tools. The runner sets
          # ANDROID_HOME, but which build-tools directory is present differs per
          # image, so look there first and fall back to the newest apksigner
          # reachable on disk before giving up.
          signer=""
          for roots in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "${HOME}/android-sdk"; do
            [ -n "${roots}" ] || continue
            candidate="$(ls -d "${roots}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)"
            if [ -n "${candidate}" ] && [ -x "${candidate}" ]; then
              signer="${candidate}"
              break
            fi
          done
          if [ -z "${signer}" ]; then
            signer="$(command -v apksigner 2>/dev/null || true)"
          fi
          if [ -z "${signer}" ]; then
            echo "apksigner not found; lookups tried ANDROID_HOME, ANDROID_SDK_ROOT and PATH" >&2
            find / -name apksigner -type f 2>/dev/null | head -n5 >&2 || true
            exit 1
          fi
          echo "Verifying with ${signer}"

          if ! "${signer}" verify --verbose "${APK}" > apksigner.log 2>&1; then
            echo "APK ${APK} failed apksigner verification" >&2
            cat apksigner.log >&2
            exit 1
          fi
          grep -E '^Verified using v[12] scheme.*true' apksigner.log || true

          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: *//p' apksigner.log | head -n1)"
          echo "APK signer SHA-256: ${actual:-<unknown>}"
          if [ -n "${EXPECTED_SHA}" ] && [ -n "${actual}" ] &&
             [ "${actual}" != "${EXPECTED_SHA}" ]; then
            echo "APK is signed by ${actual}, expected ${EXPECTED_SHA}" >&2
            exit 1
          fi
          echo "APK signature and certificate match the keystore used for this build"

      - name: Upload ${{ matrix.variant }} APK
        uses: actions/upload-artifact@v4
        with:
          name: revc-${{ matrix.variant }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
